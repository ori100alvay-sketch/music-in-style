<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070812">
<title>Music in Style — מוזיקה בסטייל שלך</title>
<meta name="description" content="Music in Style — מרחב חכם לגלות שירים ולחקור מוזיקה.">
<style>
:root{color-scheme:dark;--bg:#070812;--panel:#111321;--line:#292d45;--text:#f6f7ff;--muted:#a7acc5;--purple:#a855f7;--cyan:#22d3ee}
*{box-sizing:border-box}html{min-height:100%}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 25%,#171537 0,#0a0b16 42%,#06070c 78%);font-family:system-ui,-apple-system,Arial,sans-serif;color:var(--text);display:grid;place-items:center;padding:32px 20px;overflow-x:hidden}
main{width:min(820px,100%);text-align:center}.logo{width:min(250px,58vw);height:auto;display:block;margin:0 auto 10px;filter:drop-shadow(0 0 28px #652aff42)}.wordmark{font-size:clamp(30px,7vw,62px);letter-spacing:.12em;font-weight:500;line-height:1.2;direction:ltr;margin:4px 0 10px;white-space:nowrap}.wordmark .in{background:linear-gradient(110deg,#b35cff,#27dcf4);-webkit-background-clip:text;background-clip:text;color:transparent}.tagline{direction:ltr;color:#b8bdd2;font-size:12px;letter-spacing:.34em;margin:14px 0 30px}.hero{font-size:clamp(25px,5vw,39px);line-height:1.3;margin:28px 0 10px}.hero span{background:linear-gradient(90deg,var(--purple),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}.lead{color:var(--muted);font-size:16px;line-height:1.8;max-width:600px;margin:0 auto}.panel{margin:30px auto 0;max-width:650px;text-align:right;background:#111321d9;border:1px solid #34304d;border-radius:24px;padding:24px;box-shadow:0 25px 90px #0007,0 0 40px #6d28d91a;backdrop-filter:blur(18px)}.status{display:inline-flex;align-items:center;gap:8px;color:#9cebdc;font-size:13px}.dot{width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 12px #34d39980}.panel h2{font-size:21px;margin:18px 0}.row{display:flex;gap:10px;flex-wrap:wrap}input{flex:1;min-width:190px;background:#090a10;border:1px solid var(--line);color:white;border-radius:13px;padding:15px;font-size:16px;direction:rtl}input:focus{outline:1px solid #a855f7;border-color:#a855f7}button{border:0;border-radius:13px;padding:14px 22px;background:linear-gradient(105deg,#9333ea,#2563eb,#06b6d4);color:white;font-weight:750;font-size:15px;cursor:pointer;box-shadow:0 8px 24px #6d28d944}button:disabled{opacity:.5;cursor:wait}.hint{color:var(--muted);font-size:12px;line-height:1.6;margin-top:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#d9e4ff;line-height:1.6;text-align:left;direction:ltr}.floor-glow{height:2px;width:min(440px,75%);margin:55px auto 0;background:linear-gradient(90deg,transparent,#9333ea,#22d3ee,transparent);box-shadow:0 0 26px 5px #3b82f64a}
@media(max-width:480px){body{padding:24px 15px}.panel{padding:18px}.tagline{letter-spacing:.2em}.wordmark{letter-spacing:.07em}}
</style>
</head>
<body>
<main>
  <svg class="logo" viewBox="0 0 240 240" role="img" aria-label="Music in Style logo" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="logoGradient" x1="18%" y1="10%" x2="90%" y2="90%"><stop offset="0" stop-color="#d78aff"/><stop offset=".38" stop-color="#7c3aed"/><stop offset=".68" stop-color="#2563eb"/><stop offset="1" stop-color="#45f3ed"/></linearGradient><filter id="logoGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    <path d="M43 177V42L120 112 197 42V176" fill="none" stroke="url(#logoGradient)" stroke-width="18" stroke-linejoin="round" stroke-linecap="round" filter="url(#logoGlow)"/>
    <path d="M43 177V42L120 112 197 42V176" fill="none" stroke="#e6faff" stroke-opacity=".48" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="43" cy="183" r="22" fill="url(#logoGradient)" stroke="#d9faff" stroke-opacity=".7" stroke-width="2"/>
    <path d="M197 176c0 16-13 29-29 29" fill="none" stroke="url(#logoGradient)" stroke-width="18" stroke-linecap="round"/>
  </svg>
  <div class="wordmark">MUSIC <span class="in">IN</span> STYLE</div>
  <div class="tagline">SEARCH&nbsp; / &nbsp;ANALYZE&nbsp; / &nbsp;PLAY</div>
  <h1 class="hero">המוזיקה שלך.<br><span>בסטייל שלך.</span></h1>
  <p class="lead">מקום אחד לגלות שירים, לחקור הרמוניה ולהתחיל לעבוד עם המוזיקה שאוהבים.</p>
  <section class="panel">
    <div class="status"><span class="dot"></span><span id="health">בודק חיבור לשרת…</span></div>
    <h2>ניתוח שיר</h2>
    <form id="analyze">
      <div class="row">
        <input id="songUrl" type="url" placeholder="הדבק קישור לשיר" required>
        <button id="submit" type="submit">נתח שיר</button>
      </div>
    </form>
    <p class="hint">ניתוח מוזיקלי יפעל לאחר הגדרת ספק ה-AI וחיבור ה-API שלו בשרת.</p>
    <pre id="result" aria-live="polite"></pre>
  </section>
  <div class="floor-glow" aria-hidden="true"></div>
</main>
<script>
async function checkHealth(){const el=document.getElementById('health');try{const r=await fetch('/health');const d=await r.json();el.textContent=d.ok?'השרת מחובר':'השרת לא זמין';}catch{el.textContent='לא ניתן להתחבר לשרת';}}
checkHealth();
document.getElementById('analyze').addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('submit'),out=document.getElementById('result');btn.disabled=true;out.textContent='מנסה לנתח…';try{const r=await fetch('/api/analyze-url',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:document.getElementById('songUrl').value.trim()})});const d=await r.json();out.textContent=JSON.stringify(d,null,2);if(!r.ok)out.textContent='הניתוח עדיין לא זמין: '+(d.error||'שגיאה לא ידועה')+'\n\n'+JSON.stringify(d,null,2);}catch(err){out.textContent='לא ניתן להגיע לשרת. בדוק שהאתר נפרס בהצלחה. '+err.message;}finally{btn.disabled=false;}});
</script>
</body>
</html>
