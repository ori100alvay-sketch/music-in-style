name: Local Demucs service tests

on:
  push:
    branches: [main]
    paths:
      - "separation-service/**"
      - ".github/workflows/demucs-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "separation-service/**"
      - ".github/workflows/demucs-tests.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install service and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r separation-service/requirements.txt
      - name: Run isolated service tests
        working-directory: separation-service
        run: python -m unittest -v test_app.py
