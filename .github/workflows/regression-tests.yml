name: Music in Style quality and security checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check server JavaScript syntax
        run: node --check server.js
      - name: Run regression and platform security tests
        run: node --test
      - name: Verify required PWA and security files exist
        run: |
          test -s public/manifest.webmanifest
          test -s public/sw.js
          test -s public/icon.svg
          test -s public/copyright.html
          test -s tests/platform-security.test.js

  python-separation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight API test dependencies
        run: python -m pip install -r separation-service/requirements.txt
      - name: Run local separation service regression tests
        working-directory: separation-service
        run: python -m unittest -v test_app.py
      - name: Run Demucs worker regression tests
        working-directory: demucs-worker
        run: python -m unittest -v test_app.py
      - name: Run root worker contract tests (mocked inference)
        run: python -m unittest -v tests/test_demucs_worker.py
      - name: Check Python syntax
        run: python -m py_compile separation-service/app.py separation-service/test_app.py demucs-worker/app.py demucs-worker/test_app.py demucs_worker.py tests/test_demucs_worker.py
