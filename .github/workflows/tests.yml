name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run test suite
        run: npm test
      - name: Check server and test syntax
        run: |
          node --check server.js
          node --check music-theory.js
          node --check tests/platform-security.test.js
          node --check tests/music-theory.test.js
