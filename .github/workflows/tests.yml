name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run test suite
        run: npm test
      - name: Check server and test syntax
        run: |
          node --check server.js
          node --check music-theory.js
          node --check tests/platform-security.test.js
          node --check tests/music-theory.test.js

  root-demucs-worker-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight worker test dependencies
        run: python -m pip install "fastapi==0.115.6" "python-multipart==0.0.20" "httpx==0.28.1"
      - name: Run root Demucs worker contract tests (mocked inference)
        run: python -m unittest -v tests/test_demucs_worker.py
      - name: Check root worker syntax
        run: python -m py_compile demucs_worker.py tests/test_demucs_worker.py

  python-separation-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: separation-service
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: separation-service/requirements.txt
      - name: Install service test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run local separation service tests (mocked Demucs)
        run: python -m unittest -v test_app.py
      - name: Run separate Demucs worker regression tests (mocked inference)
        run: cd ../demucs-worker && python -m unittest -v test_app.py
      - name: Check Python syntax
        run: |
          python -m py_compile app.py test_app.py
          python -m py_compile ../demucs-worker/app.py ../demucs-worker/test_app.py
