name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - run: npm test
      - name: Check server JavaScript syntax
        run: node --check server.js
  python-worker-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight worker test dependencies
        run: pip install "fastapi==0.115.6" "python-multipart==0.0.20" "httpx==0.28.1"
      - name: Compile Demucs worker
        run: python -m py_compile demucs_worker.py
      - name: Test Demucs upload validation, readiness gate and ZIP handling with mocked inference
        run: python -m unittest discover -s tests -p "test_*.py"
