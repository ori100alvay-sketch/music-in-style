services:
  - type: web
    name: music-in-stil-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # These worker settings must be managed in the Render dashboard.
      # Keeping them sync:false prevents Blueprint deploys from resetting the
      # worker URL to localhost or disabling the explicitly configured worker.
      - key: DEMUCS_WORKER_URL
        sync: false
      - key: DEMUCS_WORKER_TOKEN
        sync: false
      - key: DEMUCS_ENABLE_LOCAL_WORKER
        sync: false
